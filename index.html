<!DOCTYPE html>
<html lang="en">
<head>
	<title>Gym Tracker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>
	<header>
		<nav>
			<button class="close-menu">X</button>
			<ul>
				<li>
					<a href="#Home">Home</a>
				</li>
				<li>
					<a href="#Login">Login</a>
				</li>
				<li>
					<a href="">History</a>
				</li>
			</ul>
			<button id="register-btn">Register</button>
		</nav>
	</header>
	<section class="frontpage" id="Home">
		<div>
			<div class="xd">
				<h1>Gym Tracker</h1>
				<img src="img/biceps.png" alt="" class="dumbbell_img">	
			</div>
			<h3>Entrena. Registra. Inspira.</h3> 
			<p>
				Anota tus ejercicios, series y repeticiones, y muestra al mundo cómo te haces más fuerte cada día.
			</p>
		</div>

	</section>
	<section class="flexbox" id="Login">
		<div class="loginText flexItem">
	         <h2>¿ESTÁS LISTO PARA MARCAR LA DIFERENCIA?</h2>
		</div>


        <div class="loginSection flexItem">
            <h3>
                INICIAR SESIÓN
            </h3>
            <form class="loginForm">
                <div class="formItem">
                    <label>
                        Usuario
                        <input type="text" name="Username" required>
                    </label>
                </div>
                <div class="formItem">
                    <label>
                        Contraseña
                        <input type="password" name="Password" required>
                    </label>
                </div>
                <div class="formItem">
                    <input type="submit" value="Login">
                </div>
            </form>
        </div>
    </section>
    
</body>
    <script src="js/script.js"></script>
</html>
