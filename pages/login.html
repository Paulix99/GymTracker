<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="../css/stylesLogin.css">
</head>
<body>
    <div class="flexbox">
        <div class="loginText flexItem">
            <h2>¿ESTÁS LISTO PARA MARCAR LA DIFERENCIA?</h2>
        </div>
        <div class="loginSection flexItem">
            <h3>
                INICIAR SESIÓN
            </h3>
            <form class="loginForm">
                <div class="formItem">
                    <label>
                        Usuario
                        <input type="text" name="Username" required>
                    </label>
                </div>
                <div class="formItem">
                    <label>
                        Contraseña
                        <input type="password" name="Password" required>
                    </label>
                </div>
                <div class="formItem">
                    <input type="submit" value="Login">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
